name: CI Build

on:
  push:
    branches:
      - develop
      - codex/**
    paths:
      - .github/workflows/ci-build.yml
      - frontend/**
      - backend/**
      - package.json
      - frontend/package.json
      - backend/package.json
      - frontend/yarn.lock
      - backend/yarn.lock
  pull_request:
    paths:
      - .github/workflows/ci-build.yml
      - frontend/**
      - backend/**
      - package.json
      - frontend/package.json
      - backend/package.json
      - frontend/yarn.lock
      - backend/yarn.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Frontend Build + Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: |
            frontend/yarn.lock
            backend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: yarn build

      - name: Install backend dependencies
        working-directory: backend
        run: yarn install --frozen-lockfile

      - name: Run backend tests
        working-directory: backend
        env:
          DATA_PATH: /tmp/shieldpm-ci
        run: |
          mkdir -p "$DATA_PATH/shieldpm"
          yarn test --run --passWithNoTests
