name: Docker Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (example: v4.3.2-geo-intelligence.2)"
        required: true
        type: string
      publish_latest:
        description: "Also publish :latest"
        required: false
        default: false
        type: boolean
      base_image:
        description: "Final-stage base image override"
        required: false
        default: "nginx:stable-bookworm"
        type: string

permissions:
  contents: write
  packages: write

jobs:
  docker-release:
    name: Build and publish Docker release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="${{ inputs.release_tag }}"
          fi

          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "release_tag must not be empty" >&2
            exit 1
          fi

          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_REPO="ghcr.io/${OWNER_LC}/shieldpm"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          BASE_IMAGE="${{ vars.SHIELDPM_BASE_IMAGE }}"

          if [[ -z "${BASE_IMAGE}" ]]; then
            BASE_IMAGE="nginx:stable-bookworm"
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ inputs.base_image }}" ]]; then
            BASE_IMAGE="${{ inputs.base_image }}"
          fi

          TAGS="${IMAGE_REPO}:${RELEASE_TAG}"
          TAGS="${TAGS}"$'\n'"${IMAGE_REPO}:${RELEASE_TAG}-${SHORT_SHA}"

          PUBLISH_LATEST="false"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PUBLISH_LATEST="true"
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.publish_latest }}" == "true" ]]; then
            PUBLISH_LATEST="true"
          fi

          if [[ "${PUBLISH_LATEST}" == "true" ]]; then
            TAGS="${TAGS}"$'\n'"${IMAGE_REPO}:latest"
          fi

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "image_repo=${IMAGE_REPO}"
            echo "short_sha=${SHORT_SHA}"
            echo "publish_latest=${PUBLISH_LATEST}"
            echo "base_image=${BASE_IMAGE}"
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BASE_IMAGE=${{ steps.meta.outputs.base_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: ShieldPM ${{ steps.meta.outputs.release_tag }}
          generate_release_notes: true
          make_latest: ${{ steps.meta.outputs.publish_latest == 'true' }}
          body: |
            Docker images were published to:

            - `${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.release_tag }}`
            - `${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.release_tag }}-${{ steps.meta.outputs.short_sha }}`
            - Build base image: `${{ steps.meta.outputs.base_image }}`

            Pull command:

            ```bash
            docker pull ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.release_tag }}
            ```
